{% extends "base.html" %}

{% block title %}Confirm Delete — PowerPulse{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card p-4 shadow-sm border-0 text-center">
        <div class="text-danger mb-3">
          <i class="bi bi-exclamation-triangle-fill display-3"></i>
        </div>
        <h4 class="fw-bold">Delete {{ type }}?</h4>
        <p class="text-secondary small">Are you sure you want to permanently delete this {{ type|lower }} record?</p>
        <div class="p-3 bg-light rounded-3 mb-4 text-dark font-monospace small">
          {{ object }}
        </div>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill flex-grow-1">
              Cancel
            </a>
            <button type="submit" class="btn btn-danger rounded-pill flex-grow-1 fw-semibold">
              Delete
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
